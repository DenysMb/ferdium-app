name: Sync develop branch with upstream

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/ferdium/ferdium-app.git
          git fetch upstream
          
      - name: Check if updates exist
        id: check_updates
        run: |
          git fetch upstream develop
          git log HEAD..upstream/develop --oneline
        continue-on-error: true

      - name: Merge and push changes
        if: steps.check_updates.outputs.stdout != '' # Só executa se houver mudanças
        run: |
          git checkout develop
          git merge upstream/develop --ff-only
          git push origin develop
