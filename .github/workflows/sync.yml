name: Sync develop branch with upstream

on:
  schedule:
    - cron: '*/15 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout fork
        uses: actions/checkout@v3
        with:
          ref: develop

      - name: Add upstream repository
        run: |
          git remote add upstream https://github.com/ferdium/ferdium-app.git
          git fetch upstream
          git checkout develop
          git merge upstream/develop --ff-only
          git push origin develop
